generated: '2026-07-18'
method: searched
status: published
source: https://github.com/bit-oasis/bitoasis-mcp
server:
  name: bitoasis
  description: >-
    Official first-party MCP server that exposes the BitOasis cryptocurrency
    exchange API as tools for AI assistants. Published by BitOasis Technologies
    on PyPI as bitoasis-mcp (MIT). Runs locally over stdio via uvx/Docker, or
    remotely over SSE at the hosted endpoint.
  vendor: BitOasis Technologies
  license: MIT
  transports:
    - type: stdio
      install: uvx bitoasis-mcp
    - type: stdio
      install: 'docker run -i --rm -e BITOASIS_API_KEY bitoasis-mcp'
    - type: sse
      url: https://mcp.bitoasis.net/sse
      auth: 'Authorization: Bearer <api-token>'
  package:
    registry: pypi
    name: bitoasis-mcp
    version: 0.2.0
    url: https://pypi.org/project/bitoasis-mcp/
  auth:
    env: BITOASIS_API_KEY
    note: >-
      API token generated at Settings > Security > Token Management on
      bitoasis.net (https://bitoasis.net/en/settings/security/tokens).
wraps_api: https://api.bitoasis.net/v1
tools:
  - name: get_markets
    description: List all tokens and trading pairs
    source_operation: openapi/bitoasis-exchange-openapi.yml#getMarkets
  - name: get_ticker
    description: Current price for a pair (e.g. BTC-AED)
    source_operation: openapi/bitoasis-exchange-openapi.yml#getTicker
  - name: get_order_book
    description: Bids and asks for a pair
