aid: bitoasis
name: BitOasis
description: >-
  BitOasis is a Middle East and North Africa (MENA) cryptocurrency exchange,
  licensed as a Virtual Asset Service Provider by Dubai's Virtual Assets
  Regulatory Authority (VARA). It lets customers buy, sell, and trade Bitcoin,
  Ether, XRP, and other digital assets against the UAE Dirham (AED) and other
  fiat currencies. BitOasis exposes a public v1 Exchange REST API
  (https://api.bitoasis.net/v1) covering market data (markets, tickers, order
  books, trades) and authenticated account operations (balances, banks, Pro
  order placement and cancellation, and crypto and fiat deposits and
  withdrawals), authenticated with a Bearer API token. BitOasis also publishes
  an official open-source MCP server (bitoasis-mcp) that exposes the exchange as
  23 tools for AI agents, over stdio or a hosted SSE endpoint. Originally added
  to the API Evangelist network as a pantera-capital portfolio lead, this
  profile has been enriched from BitOasis' first-party public developer surface.
